[project]
name = "pca"
version = "0.1.0"
description = "Headless agent core for a macOS computer-use agent"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]
ollama = ["httpx>=0.27"]

[project.scripts]
pca = "pca.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: requires a running local Ollama server (opt-in)"]
addopts = "-m 'not ollama'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pca"]
