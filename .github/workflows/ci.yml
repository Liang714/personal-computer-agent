name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,ollama]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy src
      - run: python -m pytest -v
      # The control suite proves every benchmark task is correctly specified.
      # It uses the scripted oracle, so it needs no model and no network.
      - run: python -m pca.cli bench --model scripted --workdir "$RUNNER_TEMP/bench"
